name: Birthday reminders
run-name: ${{ inputs.caller == 'apps-script' && format('Birthday reminders (8 AM trigger{0})', inputs.dry_run && ', dry run' || '') || github.workflow }}

# Every day at 8 AM Eastern: find birthdays that are today or a week away in
# the YAC Member Directory and hand one message to ncssm-yac/yac-chat.
# Started on time by the YAC Birthday Trigger Apps Script (apps-script/),
# which runs every 15 minutes as ncssm.yac.yakkety@gmail.com and dispatches
# this once a day from 8 AM New York time. The schedule below is the backup.
# Live in YAC Leadership since Nov 6, 2026 (owner's decision; yac-chat allows
# the yac-birthdays source in leadership and it). The made-up sample still
# goes to YAC IT, marked TEST, so checking the posting path never reaches
# Leadership.
#
# Secrets: YAKKETY_GOOGLE_KEY (the yakkety service account, Viewer on the YAC
# Member Directory), YAC_REPOS_TOKEN (fine-grained: Actions write on
# yac-chat). Logs show counts only, never names or dates.
on:
  schedule:
    # Backup only. 8 AM Eastern is 12:00 UTC in summer and 13:00 UTC in
    # winter. GitHub delays scheduled runs (7-9 hours in Nov 2026), so
    # there are several tries off the hour. The gate lets through the first
    # one that is 8 AM or later in New York, and the cache stops a double.
    - cron: '17 12 * * *'
    - cron: '17 13 * * *'
    - cron: '17 15 * * *'
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Work it out and print counts, but send nothing (untick to really post to YAC Leadership)
        type: boolean
        default: true
      sample:
        description: Skip the Sheet and post a made-up sample (Ada Test, Ben Sample) to YAC IT to check posting
        type: boolean
        default: false
      caller:
        description: Who started this run (the Apps Script sends apps-script; leave as is)
        type: string
        default: manual

permissions:
  contents: read

concurrency:
  group: birthdays
  cancel-in-progress: false

env:
  SHEET_ID: 1imJ__Ll68PiNXnzYuGYthpwzKe65aqvNwUSbnApUmu4
  SPACE: ${{ inputs.sample == true && 'it' || 'leadership' }}
  TEST: 'false'

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Is it time?
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          today=$(TZ=America/New_York date +%F)
          hour=$(TZ=America/New_York date +%H)
          echo "key=birthdays-sent-$today" >> "$GITHUB_OUTPUT"
          # Any time from 8 AM to midnight: a late reminder beats none. (The old
          # 8-11 AM window blocked every scheduled run, since they arrived after
          # noon.)
          if [ "$EVENT" = "schedule" ] && [ "$hour" -lt 8 ]; then
            echo "It is $hour:00 in New York; reminders go out from 8 AM."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Already done today?
        id: done
        if: steps.gate.outputs.go == 'true' && inputs.sample != true
        uses: actions/cache/restore@v4
        with:
          path: .sent
          key: ${{ steps.gate.outputs.key }}
          lookup-only: true

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true' && steps.done.outputs.cache-hit != 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true' && steps.done.outputs.cache-hit != 'true'
        with:
          node-version: 20

      - name: Run tests
        if: steps.gate.outputs.go == 'true' && steps.done.outputs.cache-hit != 'true'
        run: npm test

      - name: Remind
        id: remind
        if: steps.gate.outputs.go == 'true' && steps.done.outputs.cache-hit != 'true'
        run: node run.js
        env:
          SA_JSON: ${{ secrets.YAKKETY_GOOGLE_KEY }}
          GH_TOKEN: ${{ secrets.YAC_REPOS_TOKEN }}
          # Scheduled runs are real; by hand defaults to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SAMPLE: ${{ github.event_name == 'workflow_dispatch' && inputs.sample || 'false' }}

      # Only a real post marks the day done. A quiet day or a dry run must not,
      # or it would block a real run later the same day.
      - name: Remember that today is done
        if: steps.remind.outputs.result == 'posted'
        env:
          KEY: ${{ steps.gate.outputs.key }}
        run: mkdir -p .sent && echo "$KEY" > .sent/done
      - uses: actions/cache/save@v4
        if: steps.remind.outputs.result == 'posted'
        with:
          path: .sent
          key: ${{ steps.gate.outputs.key }}

      # The day's last try must not end green without reminding. A run that
      # skips Remind still ends "success", which hid two weeks of missed
      # reminders (Oct 20 to Nov 2, 2026). Failing here makes the ci: check in
      # Yakkety's monitor see it too.
      - name: Did today get its reminder?
        if: github.event.schedule == '17 18 * * *' && steps.remind.outcome != 'success' && steps.done.outputs.cache-hit != 'true'
        env:
          GO: ${{ steps.gate.outputs.go }}
        run: |
          echo "::error::The last scheduled try today ended without running Remind (gate: go=$GO). Run it by hand from Actions with dry run unticked."
          exit 1
