name: Apps Script

# Keeps the YAC Birthday Trigger Apps Script (apps-script/src) in step with
# this repo, through YAC's shared deploy (ncssm-yac/yac-apps-script-deploy).
# GitHub is the only source of truth: nobody pastes code into the editor.
#
# - Pull request: tests only.
# - Merge to main touching apps-script/ (or Run workflow): tests, then
#   `clasp push`, then the drift check.
# - Every day: drift check. Fails if the live code differs from the repo or
#   the clasp sign-in has stopped working.
#
# Secret: CLASPRC_JSON (organization secret; see the shared repo's README).
on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/apps-script.yml']
  pull_request:
    paths: ['apps-script/**', '.github/workflows/apps-script.yml', '.github/workflows/daily.yml']
  schedule:
    - cron: '43 16 * * *' # any time of day is fine for the check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ncssm-yac/yac-apps-script-deploy/.github/workflows/deploy.yml@main
    with:
      title: YAC Birthday Trigger
      src_dir: apps-script/src
      test_command: node apps-script/test/run-tests.js
    secrets:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
